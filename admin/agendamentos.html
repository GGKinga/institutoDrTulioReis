<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamentos — Admin · Instituto Dr Túlio Reis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<div class="admin-layout">
  <div id="sidebarPlaceholder"></div>

  <div class="admin-main">
    <header class="admin-topbar">
      <button class="topbar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
      <div class="topbar-title">Agendamentos <small>Gerencie as solicitações de consulta</small></div>
      <div class="topbar-actions">
        <select class="form-control" id="filterStatus" style="width:auto;padding:.5rem .9rem;">
          <option value="">Todos os status</option>
          <option value="novo">Novo</option>
          <option value="confirmado">Confirmado</option>
          <option value="concluido">Concluído</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </div>
    </header>

    <main class="admin-content">
      <!-- Summary cards -->
      <div class="stats-grid" id="statsGrid" style="margin-bottom:1.25rem;"></div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Lista de Agendamentos</span>
          <div class="search-bar">
            <div class="search-input-wrap">
              <i class="fas fa-search"></i>
              <input type="text" id="searchInput" placeholder="Buscar por nome, serviço...">
            </div>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Paciente</th><th>Telefone</th><th>E-mail</th><th>Serviço</th><th>Data Preferida</th><th>Status</th><th>Recebido em</th><th>Ações</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h2>Detalhes do Agendamento</h2>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="btnCancel">Fechar</button>
      <button class="btn btn-success" id="btnConfirm"><i class="fas fa-check"></i> Confirmar</button>
      <button class="btn btn-primary" id="btnComplete"><i class="fas fa-check-double"></i> Concluir</button>
      <button class="btn btn-danger" id="btnCancelAppointment"><i class="fas fa-times"></i> Cancelar</button>
    </div>
  </div>
</div>

<script src="../assets/js/cms.js"></script>
<script src="../assets/js/sidebar.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
Admin.checkAuth();
CMS.init();
Admin.initSidebar();

let currentId = null;

function render() {
  const statusFilter = document.getElementById('filterStatus').value;
  const search = document.getElementById('searchInput').value.toLowerCase();
  let items = CMS.get('appointments') || [];

  if (statusFilter) items = items.filter(a => a.status === statusFilter);
  if (search) items = items.filter(a =>
    (a.name||'').toLowerCase().includes(search) ||
    (a.service||'').toLowerCase().includes(search) ||
    (a.email||'').toLowerCase().includes(search)
  );

  // Stats
  const all = CMS.get('appointments') || [];
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="stat-icon yellow"><i class="fas fa-clock"></i></div><div><div class="stat-value">${all.filter(a=>a.status==='novo').length}</div><div class="stat-label">Novos</div></div></div>
    <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-calendar-check"></i></div><div><div class="stat-value">${all.filter(a=>a.status==='confirmado').length}</div><div class="stat-label">Confirmados</div></div></div>
    <div class="stat-card"><div class="stat-icon green"><i class="fas fa-check-double"></i></div><div><div class="stat-value">${all.filter(a=>a.status==='concluido').length}</div><div class="stat-label">Concluídos</div></div></div>
    <div class="stat-card"><div class="stat-icon red"><i class="fas fa-times-circle"></i></div><div><div class="stat-value">${all.filter(a=>a.status==='cancelado').length}</div><div class="stat-label">Cancelados</div></div></div>
  `;

  const body = document.getElementById('tableBody');
  if (!items.length) {
    body.innerHTML = `<tr><td colspan="8"><div class="empty-state"><i class="fas fa-calendar-times"></i><h3>Nenhum agendamento encontrado</h3></div></td></tr>`;
    return;
  }
  const statusMap = { novo: ['yellow','Novo'], confirmado: ['blue','Confirmado'], concluido: ['green','Concluído'], cancelado: ['red','Cancelado'] };
  body.innerHTML = items.slice().reverse().map(a => {
    const [color, label] = statusMap[a.status] || ['gray', a.status];
    return `
      <tr>
        <td><strong>${Admin.escapeHtml(a.name)}</strong></td>
        <td>${Admin.escapeHtml(a.phone||'—')}</td>
        <td>${Admin.escapeHtml(a.email||'—')}</td>
        <td>${Admin.escapeHtml(a.service||'—')}</td>
        <td>${Admin.escapeHtml(a.preferredDate||'—')}</td>
        <td>${Admin.badge(label, color)}</td>
        <td>${Admin.formatDate(a.createdAt)}</td>
        <td>
          <button class="btn btn-ghost btn-sm" onclick="openDetail(${a.id})"><i class="fas fa-eye"></i></button>
          <button class="btn btn-danger btn-sm btn-icon" onclick="del(${a.id})" title="Excluir"><i class="fas fa-trash"></i></button>
        </td>
      </tr>
    `;
  }).join('');
}

function openDetail(id) {
  const a = CMS.getItem('appointments', id);
  if (!a) return;
  currentId = id;
  document.getElementById('modalBody').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
      <div><strong>Paciente:</strong><br>${Admin.escapeHtml(a.name)}</div>
      <div><strong>Telefone:</strong><br>${Admin.escapeHtml(a.phone||'—')}</div>
      <div><strong>E-mail:</strong><br>${Admin.escapeHtml(a.email||'—')}</div>
      <div><strong>Serviço:</strong><br>${Admin.escapeHtml(a.service||'—')}</div>
      <div><strong>Data Preferida:</strong><br>${Admin.escapeHtml(a.preferredDate||'—')}</div>
      <div><strong>Status:</strong><br>${a.status}</div>
    </div>
    ${a.notes ? `<div style="margin-top:1rem"><strong>Observações:</strong><br><p style="margin-top:.3rem;color:var(--admin-text-muted)">${Admin.escapeHtml(a.notes)}</p></div>` : ''}
    <div style="margin-top:1rem;color:var(--admin-text-muted);font-size:.8rem">Recebido em: ${Admin.formatDateTime(a.createdAt)}</div>
  `;
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); currentId = null; }

function setStatus(status) {
  if (!currentId) return;
  CMS.updateItem('appointments', currentId, { status });
  Admin.showToast(`Status atualizado para "${status}".`);
  closeModal();
  render();
}

function del(id) {
  if (!Admin.confirm('Excluir este agendamento?')) return;
  CMS.deleteItem('appointments', id);
  Admin.showToast('Agendamento excluído.', 'warning');
  render();
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('btnCancel').addEventListener('click', closeModal);
document.getElementById('btnConfirm').addEventListener('click', () => setStatus('confirmado'));
document.getElementById('btnComplete').addEventListener('click', () => setStatus('concluido'));
document.getElementById('btnCancelAppointment').addEventListener('click', () => setStatus('cancelado'));
document.getElementById('filterStatus').addEventListener('change', render);
document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

render();
</script>
</body>
</html>
