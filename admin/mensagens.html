<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensagens — Admin · Instituto Dr Túlio Reis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<div class="admin-layout">
  <div id="sidebarPlaceholder"></div>

  <div class="admin-main">
    <header class="admin-topbar">
      <button class="topbar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
      <div class="topbar-title">Mensagens <small>Mensagens recebidas pelo formulário de contato</small></div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" id="btnMarkAll"><i class="fas fa-check-double"></i> Marcar todas como lidas</button>
      </div>
    </header>

    <main class="admin-content">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Caixa de Entrada</span>
          <div class="search-bar">
            <div class="search-input-wrap">
              <i class="fas fa-search"></i>
              <input type="text" id="searchInput" placeholder="Buscar por nome, assunto...">
            </div>
            <select class="form-control" id="filterRead" style="width:auto;">
              <option value="">Todas</option>
              <option value="unread">Não lidas</option>
              <option value="read">Lidas</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Nome</th><th>E-mail</th><th>Telefone</th><th>Assunto</th><th>Status</th><th>Recebida em</th><th>Ações</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h2>Detalhes da Mensagem</h2>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="btnClose">Fechar</button>
      <button class="btn btn-danger" id="btnDelete"><i class="fas fa-trash"></i> Excluir</button>
    </div>
  </div>
</div>

<script src="../assets/js/cms.js"></script>
<script src="../assets/js/sidebar.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
Admin.checkAuth();
CMS.init();
Admin.initSidebar();

let currentId = null;

function render() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const readFilter = document.getElementById('filterRead').value;
  let items = CMS.get('messages') || [];

  if (readFilter === 'unread') items = items.filter(m => !m.read);
  if (readFilter === 'read') items = items.filter(m => m.read);
  if (search) items = items.filter(m =>
    (m.name||'').toLowerCase().includes(search) ||
    (m.subject||'').toLowerCase().includes(search) ||
    (m.email||'').toLowerCase().includes(search)
  );

  const body = document.getElementById('tableBody');
  if (!items.length) {
    body.innerHTML = `<tr><td colspan="7"><div class="empty-state"><i class="fas fa-inbox"></i><h3>Nenhuma mensagem encontrada</h3></div></td></tr>`;
    return;
  }
  body.innerHTML = items.slice().reverse().map(m => `
    <tr style="${!m.read ? 'font-weight:600;' : ''}">
      <td>${Admin.escapeHtml(m.name)}</td>
      <td>${Admin.escapeHtml(m.email||'—')}</td>
      <td>${Admin.escapeHtml(m.phone||'—')}</td>
      <td class="td-wrap">${Admin.escapeHtml(m.subject||'(sem assunto)')}</td>
      <td>${Admin.badge(m.read ? 'Lida' : 'Nova', m.read ? 'gray' : 'red')}</td>
      <td>${Admin.formatDate(m.createdAt)}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-ghost btn-sm" onclick="openDetail(${m.id})"><i class="fas fa-eye"></i></button>
        <button class="btn btn-danger btn-sm btn-icon" onclick="del(${m.id})"><i class="fas fa-trash"></i></button>
      </td>
    </tr>
  `).join('');
}

function openDetail(id) {
  const m = CMS.getItem('messages', id);
  if (!m) return;
  currentId = id;
  // Mark as read
  if (!m.read) { CMS.updateItem('messages', id, { read: true }); render(); }
  document.getElementById('modalBody').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">
      <div><strong>De:</strong><br>${Admin.escapeHtml(m.name)}</div>
      <div><strong>E-mail:</strong><br>${Admin.escapeHtml(m.email||'—')}</div>
      <div><strong>Telefone:</strong><br>${Admin.escapeHtml(m.phone||'—')}</div>
      <div><strong>Assunto:</strong><br>${Admin.escapeHtml(m.subject||'(sem assunto)')}</div>
    </div>
    <div style="background:var(--admin-body-bg);padding:1rem;border-radius:.4rem;border:1px solid var(--admin-border);">
      <strong>Mensagem:</strong>
      <p style="margin-top:.5rem;white-space:pre-wrap;color:var(--admin-text)">${Admin.escapeHtml(m.message||m.notes||'')}</p>
    </div>
    <div style="margin-top:.75rem;color:var(--admin-text-muted);font-size:.8rem;">Recebida em: ${Admin.formatDateTime(m.createdAt)}</div>
    ${m.email ? `<div style="margin-top:.75rem"><a href="mailto:${Admin.escapeHtml(m.email)}?subject=Re: ${Admin.escapeHtml(m.subject||'Sua mensagem')}" class="btn btn-primary btn-sm"><i class="fas fa-reply"></i> Responder por e-mail</a></div>` : ''}
  `;
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); currentId = null; }

function del(id) {
  if (!Admin.confirm('Excluir esta mensagem?')) return;
  if (currentId === id) closeModal();
  CMS.deleteItem('messages', id);
  Admin.showToast('Mensagem excluída.', 'warning');
  render();
}

document.getElementById('btnDelete').addEventListener('click', () => { if (currentId) del(currentId); });
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('btnClose').addEventListener('click', closeModal);
document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('filterRead').addEventListener('change', render);
document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.getElementById('btnMarkAll').addEventListener('click', () => {
  const msgs = CMS.get('messages') || [];
  msgs.forEach(m => { if (!m.read) CMS.updateItem('messages', m.id, { read: true }); });
  Admin.showToast('Todas as mensagens marcadas como lidas.');
  render();
});

render();
</script>
</body>
</html>
