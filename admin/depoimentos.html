<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Depoimentos — Admin · Instituto Dr Túlio Reis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<div class="admin-layout">
  <div id="sidebarPlaceholder"></div>

  <div class="admin-main">
    <header class="admin-topbar">
      <button class="topbar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
      <div class="topbar-title">Depoimentos <small>Gerencie os depoimentos de pacientes</small></div>
      <div class="topbar-actions">
        <button class="btn btn-primary" id="btnNew"><i class="fas fa-plus"></i> Novo Depoimento</button>
      </div>
    </header>

    <main class="admin-content">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Depoimentos de Pacientes</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Paciente</th><th>Perfil</th><th>Avaliação</th><th>Depoimento</th><th>Status</th><th>Ações</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Novo Depoimento</h2>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body">
      <form id="itemForm">
        <input type="hidden" id="itemId">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Nome do Paciente *</label>
            <input type="text" class="form-control" id="fName" required placeholder="Nome Sobrenome">
          </div>
          <div class="form-group">
            <label class="form-label">Perfil (ex: Atleta, Paciente)</label>
            <input type="text" class="form-control" id="fRole" placeholder="Maratonista">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Depoimento *</label>
          <textarea class="form-control" id="fText" rows="4" required placeholder="O que o paciente disse..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Avaliação (1–5 estrelas)</label>
          <select class="form-control" id="fRating">
            <option value="5">⭐⭐⭐⭐⭐ 5 estrelas</option>
            <option value="4">⭐⭐⭐⭐ 4 estrelas</option>
            <option value="3">⭐⭐⭐ 3 estrelas</option>
            <option value="2">⭐⭐ 2 estrelas</option>
            <option value="1">⭐ 1 estrela</option>
          </select>
        </div>
        <div class="form-check">
          <input type="checkbox" id="fActive" checked>
          <label for="fActive" class="form-label" style="margin:0">Ativo (visível no site)</label>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="btnCancel">Cancelar</button>
      <button class="btn btn-primary" id="btnSave"><i class="fas fa-save"></i> Salvar</button>
    </div>
  </div>
</div>

<script src="../assets/js/cms.js"></script>
<script src="../assets/js/sidebar.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
Admin.checkAuth();
CMS.init();
Admin.initSidebar();

let editingId = null;

function render() {
  const items = CMS.get('testimonials') || [];
  const body = document.getElementById('tableBody');
  if (!items.length) {
    body.innerHTML = `<tr><td colspan="6"><div class="empty-state"><i class="fas fa-comments"></i><h3>Nenhum depoimento</h3><p>Clique em "Novo Depoimento" para adicionar.</p></div></td></tr>`;
    return;
  }
  body.innerHTML = items.map(t => `
    <tr>
      <td><strong>${Admin.escapeHtml(t.name)}</strong></td>
      <td>${Admin.escapeHtml(t.role || '—')}</td>
      <td>${'★'.repeat(t.rating || 5)}</td>
      <td class="td-wrap">${Admin.escapeHtml(t.text)}</td>
      <td>${Admin.badge(t.active ? 'Ativo' : 'Inativo', t.active ? 'green' : 'gray')}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-ghost btn-sm btn-icon" onclick="openEdit(${t.id})" title="Editar"><i class="fas fa-edit"></i></button>
        <button class="btn btn-danger btn-sm btn-icon" onclick="del(${t.id})" title="Excluir"><i class="fas fa-trash"></i></button>
      </td>
    </tr>
  `).join('');
}

function openNew() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Novo Depoimento';
  ['itemId','fName','fRole','fText'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fRating').value = '5';
  document.getElementById('fActive').checked = true;
  document.getElementById('modal').classList.add('open');
}

function openEdit(id) {
  const t = CMS.getItem('testimonials', id);
  if (!t) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = 'Editar Depoimento';
  document.getElementById('itemId').value = id;
  document.getElementById('fName').value = t.name;
  document.getElementById('fRole').value = t.role || '';
  document.getElementById('fText').value = t.text;
  document.getElementById('fRating').value = String(t.rating || 5);
  document.getElementById('fActive').checked = !!t.active;
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

function save() {
  const name = document.getElementById('fName').value.trim();
  const text = document.getElementById('fText').value.trim();
  if (!name || !text) { Admin.showToast('Preencha os campos obrigatórios.', 'error'); return; }
  const payload = { name, role: document.getElementById('fRole').value.trim(), text, rating: parseInt(document.getElementById('fRating').value), active: document.getElementById('fActive').checked };
  if (editingId) { CMS.updateItem('testimonials', editingId, payload); Admin.showToast('Depoimento atualizado!'); }
  else { CMS.addItem('testimonials', payload); Admin.showToast('Depoimento adicionado!'); }
  closeModal();
  render();
}

function del(id) {
  if (!Admin.confirm('Deseja excluir este depoimento?')) return;
  CMS.deleteItem('testimonials', id);
  Admin.showToast('Depoimento excluído.', 'warning');
  render();
}

document.getElementById('btnNew').addEventListener('click', openNew);
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('btnCancel').addEventListener('click', closeModal);
document.getElementById('btnSave').addEventListener('click', save);
document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

render();
</script>
</body>
</html>
